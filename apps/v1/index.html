<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="A Presidência: simulador de decisões presidenciais e seus impactos na economia, popularidade, segurança e mais."
    />
    <title>A Presidência</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="A Presidência" />
    <meta
      property="og:description"
      content="Simulador de decisões presidenciais e seus impactos na economia, popularidade, segurança e mais."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="A Presidência" />
    <meta
      name="twitter:description"
      content="Simulador de decisões presidenciais e seus impactos na economia, popularidade, segurança e mais."
    />
    <meta name="twitter:image" content="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Aplica o tema salvo antes do primeiro paint — sem isso, a página sempre nasce no
      // tema escuro padrão e só troca para claro depois que o React monta e o useEffect de
      // useTheme roda, causando um flash visível do tema errado para quem usa o tema claro.
      try {
        if (localStorage.getItem("presidencia:theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch {
        // Armazenamento indisponível — segue com o tema padrão.
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
