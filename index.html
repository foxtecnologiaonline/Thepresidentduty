<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Jogos de decisão por turnos: A Presidência (governe um país por 16 trimestres) e A Dinastia (governe 5 reinados medievais encadeados)."
    />
    <title>A Presidência & A Dinastia</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Aplica o tema salvo antes do primeiro paint — sem isso, a página sempre nasce no
      // tema escuro padrão e só troca para claro depois que o React monta e o useEffect de
      // useTheme roda, causando um flash visível do tema errado para quem usa o tema claro.
      try {
        if (localStorage.getItem("presidencia:theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch {
        // Armazenamento indisponível — segue com o tema padrão.
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
